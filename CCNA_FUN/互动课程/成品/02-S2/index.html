<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPv4 的逐跳寿命 · 02-S2</title>
<style>
:root{--ink:#1b2a33;--blue:#0b5f8a;--line:#b9c8cf;--soft:#4d616b;--light:#e9f2f8;--orange:#8a4a12;--bad:#a3362f;--off:#93a3ab;color:var(--ink);font:16px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0;background:#f3f6f7}header{border-bottom:1px solid var(--line);background:white}header div,main{max-width:1184px;padding:0 22px;margin:auto}header div{padding-block:12px;display:flex;justify-content:space-between;font-size:.9rem}h1{font-size:clamp(1.75rem,3vw,2.6rem);margin:20px 0 2px;line-height:1.25}h2,h3,p{margin:0}h2{font-size:1.22rem}main>p{color:var(--soft);margin-bottom:12px}button{font:inherit;border:1px solid #8fa9b3;border-radius:7px;background:white;color:var(--ink);padding:7px 12px;cursor:pointer}button:hover{background:#eaf3f8}button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid #105cab;outline-offset:2px}.primary{background:var(--blue);color:white;font-weight:700;border-color:var(--blue)}.primary:hover{background:#084969}.layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(305px,1fr);align-items:start;gap:16px}.card,details{background:white;border:1px solid var(--line);border-radius:12px;min-width:0}.card{overflow:hidden}.head{background:#16323f;color:white;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:6px}.head small{color:#c5e0ee;font:600 .85rem monospace}.diagram{padding:12px 18px 10px;background:linear-gradient(#f1f6f9,#fff)}.topo{display:grid;grid-template-columns:auto minmax(28px,1fr) auto minmax(28px,1fr) auto minmax(28px,1fr) auto;align-items:center;gap:2px;margin-bottom:10px}.node{border:1px solid var(--line);border-radius:6px;background:white;padding:3px 8px;font-size:.82rem;font-weight:700;text-align:center;white-space:nowrap}.node small{display:block;font-weight:400;color:var(--soft);font-size:.72rem}.node.r1{border:2px solid var(--blue)}.node.dead{border-color:var(--bad);color:var(--bad)}.node.dead small{color:var(--bad)}.link{position:relative;height:38px;display:flex;align-items:center;justify-content:center;min-width:28px}.link:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:3px solid var(--blue)}.link.off:before{border-top:2px dashed var(--off)}.link:after{content:"";position:absolute;right:-1px;top:50%;margin-top:-6px;border:6px solid transparent;border-right:0;border-left:9px solid var(--blue)}.link.off:after{border-left-color:var(--off)}.chip{position:relative;z-index:1;background:var(--blue);color:white;border-radius:999px;padding:1px 8px;font:700 .76rem ui-monospace,monospace;white-space:nowrap}.chip.wait{background:var(--off)}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 26px minmax(0,1fr) 26px minmax(0,1fr);align-items:stretch}.pos{border:1px solid var(--line);border-radius:9px;background:white;padding:8px 10px;text-align:center;min-width:0;display:flex;flex-direction:column;justify-content:center}.pos .t{font-size:.82rem;color:var(--soft);font-weight:700}.pos .v{font:700 1.2rem ui-monospace,monospace;margin:3px 0;white-space:nowrap}.pos .d{font-size:.84rem;color:var(--soft)}.pos.cur{border:2px solid var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}.pos.good{border-color:var(--blue)}.pos.good .v{color:var(--blue)}.pos.bad{border-color:var(--bad)}.pos.bad .v,.pos.bad .d{color:var(--bad)}.to{position:relative}.to:before{content:"";position:absolute;left:3px;right:3px;top:50%;border-top:3px solid var(--blue)}.to:after{content:"";position:absolute;right:-1px;top:50%;margin-top:-6px;border:6px solid transparent;border-right:0;border-left:9px solid var(--blue)}.to.off:before{border-top:3px dashed var(--off)}.to.off:after{border-left-color:var(--off)}
.gauge{border-top:1px solid var(--line);padding:9px 0 4px;margin-top:9px}.meta{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;margin-bottom:6px}.meta small{color:var(--soft)}.cells{display:flex;gap:5px;flex-wrap:wrap}.cell{width:70px;border:2px solid var(--blue);border-radius:5px;background:var(--light);text-align:center;padding:1px 0}.cell b{font:700 1.05rem ui-monospace,monospace}.cell small{display:block;font-size:.72rem;color:var(--soft)}.cell.used{border-style:dashed;border-color:var(--bad);background:white}.cell.used b{color:var(--bad);text-decoration:line-through}.cell.used small{color:var(--bad);font-weight:700}.limits{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:5px;font-size:.92rem}.verdict{font-weight:700;color:var(--blue)}.verdict.bad{color:var(--bad)}.note{padding:10px 16px;border-top:1px solid var(--line);background:#f2f6f8;font-size:.94rem}.note b{color:var(--blue)}.tools{display:flex;gap:7px;flex-wrap:wrap;padding:0 16px 12px;background:#f2f6f8}.tools:empty{padding:0}.tools button{font-size:.88rem}.panel{padding:16px 18px}.panel p{color:var(--soft);margin:7px 0}.kicker{color:var(--blue);font-weight:700;font-size:.88rem;margin-bottom:5px}fieldset{border:0;padding:0;margin:10px 0;min-width:0}legend{font-weight:700;margin:0 0 4px;padding:0}.choice{display:block;border:1px solid var(--line);border-radius:7px;padding:7px 9px;margin:4px 0;font-size:.94rem;cursor:pointer}.choice:has(:checked){border-color:var(--blue);background:var(--light)}input[type=radio]{accent-color:var(--blue)}.feedback{border-left:3px solid #ae651a;background:#fff3da;padding:7px 9px;margin:8px 0}.stats{background:var(--light);border-radius:8px;padding:9px;margin:8px 0}.keep{font-weight:700}details{padding:9px 14px;margin:10px 0}summary{cursor:pointer;font-weight:650}details p,details ol{margin:7px 0}footer{margin-bottom:18px}
@media(max-width:820px){.layout{grid-template-columns:1fr}header div,main{padding-inline:14px}.topo{grid-template-columns:1fr;gap:0;justify-items:center}.node{min-width:9em}.link{height:32px;width:3px;min-width:0}.link:before{left:0;right:auto;top:0;bottom:0;border-top:0;border-left:3px solid var(--blue)}.link.off:before{border-left:3px dashed var(--off);border-top:0}.link:after{right:auto;left:0;top:auto;bottom:-2px;margin:0 0 0 -6px;transform:rotate(90deg)}.chip{position:absolute;left:calc(100% + 10px)}.stage{grid-template-columns:minmax(0,1fr)}.to{height:26px}.to:before{left:50%;right:auto;top:3px;bottom:3px;border-top:0;border-left:3px solid var(--blue)}.to.off:before{border-left:3px dashed var(--off);border-top:0}.to:after{right:auto;left:50%;top:auto;bottom:-2px;margin:0 0 0 -6px;transform:rotate(90deg)}}
</style></head><body><header><div><strong>CCNA 互动课程 · 网络层</strong><span>02-S2</span></div></header><main>
<h1>IPv4 的逐跳寿命</h1><p>站在中转路由器 R1，判断刚到的包能不能从出口发出。</p>
<div class="layout"><section class="card" aria-label="拓扑与三个位置"><div class="head"><h2 id="chartTitle"></h2><small id="eid"></small></div><div class="diagram" id="chart"></div><div class="note" id="caption"></div><div class="tools" id="tools"></div></section><section class="card panel" aria-label="课程操作" id="panel"></section></div>
<footer><details><summary>规则与题设</summary><p><b>TTL</b> 是 IPv4 包头里的一个计数值，单位是跳。<b>每经一台路由器转发，TTL 减 1</b>；减完之后必须仍大于零，这个包才能从出口发出。</p><p>题设：一个普通 IPv4 单播包到达中转路由器 R1；R1 已有去往目的地的有效路由；除 TTL 外没有其他丢包原因。</p></details><details><summary>本轮已观察的事件</summary><ol id="log"></ol></details></footer></main>
<script>
"use strict";
const $=id=>document.getElementById(id);
const vals=[2,1]; // 入站 TTL：主例、迁移
const results=["向下一跳转发","在本机丢弃"];
const whys=["扣减后 TTL 仍大于零，才可继续转发","路由表里已有有效路由，所以一定转发"];
const follow="是在送达中转设备时检查，还是已经完成了转发扣减？",fchoices=["送达中转设备时就检查","完成转发扣减后再检查"],FRIGHT=1;
const names=["接收入站包","读取入站 TTL","扣减并判决"];
const blank=()=>({step:0,result:"",why:"",follow:"",lock:false,got:false,tries:0,sub:null,subWhy:null,revealed:false,msg:""});
const fresh=()=>({round:0,cases:[blank(),blank()],summary:false,review:null});
let progress=fresh();
function button(action,title,primary=false){return '<button type="button" data-action="'+action+'" class="'+(primary?'primary':'')+'">'+title+'</button>'}
function context(){
 const s=progress,r=s.review?s.review.r:s.round,k=s.review?s.review.k:s.cases[r].step,val=vals[r],out=val-1;
 return {s,r,k,val,out,fwd:out>0,right:out>0?0:1,id:"02B-"+(r?"V":"M")+"-E"+k};
}
function descriptions(c){
 const {val,out,fwd}=c;
 return ["一个普通 IPv4 单播包到达中转路由器 R1，先读取它的 TTL。",
 "入站 TTL 为 "+val+"。R1 查到有效路由，准备转发，尚未扣减。",
 fwd?"R1 转发时把 TTL 减 1，"+val+" − 1 = "+out+"；"+out+" > 0，包以 TTL "+out+" 从出口发往下一跳。":"R1 转发时把 TTL 减 1，"+val+" − 1 = 0；0 不大于 0，包在 R1 到期，不从出口发出。"];
}
function pos(cls,title,value,desc){return '<div class="pos '+cls+'"><div class="t">'+title+'</div><div class="v">'+value+'</div><div class="d">'+desc+'</div></div>'}
function graph(c){
 const {k,val,out,fwd}=c,read=k>=1,done=k===2;
 let h='<div class="topo" aria-label="H1 经 R1、R2 到 H2">';
 h+='<div class="node">H1<small>发送方</small></div>';
 h+='<div class="link">'+(done?'':'<span class="chip'+(read?'':' wait')+'">TTL '+(read?val:'?')+' →</span>')+'</div>';
 h+='<div class="node r1'+(done&&!fwd?' dead':'')+'">R1<small>'+(done&&!fwd?'包在此到期 ✕':'中转路由器')+'</small></div>';
 if(done&&fwd)h+='<div class="link"><span class="chip">TTL '+out+' →</span></div>';
 else h+='<div class="link off">'+(read&&!done?'<span class="chip wait">去向 ?</span>':'')+'</div>';
 h+='<div class="node">R2<small>下一跳</small></div><div class="link off"></div><div class="node">H2<small>目的地</small></div></div>';
 h+='<div class="stage" aria-label="入站、扣减、出口三个位置">';
 h+=pos("in"+(k===0?" cur":"")+(done?" good":""),"① 入站",'TTL '+(read?val:"?"),read?"包已到达 R1":"等待读取");
 h+='<div class="to"></div>';
 h+=pos("dec"+(k===1?" cur":"")+(done?" "+(fwd?"good":"bad"):""),"② R1 转发扣减",read?val+" − 1 = "+(done?out:"?"):"? − 1 = ?",done?"转发时扣减 1":read?"待执行":"未开始");
 h+='<div class="to'+(done&&fwd?"":" off")+'"></div>';
 h+=pos("exit"+(k===2?" cur":"")+(done?" "+(fwd?"good":"bad"):""),"③ 出口",done?(fwd?"TTL "+out:"无出站包"):"?",done?(fwd?"大于 0 → 可发出":"不大于 0 → 丢弃"):read?"待判决":"未开始");
 h+='</div><div class="gauge"><div class="meta"><b>TTL 额度尺</b><small>'+(read?'每格 1 跳 · 入站 '+val+' 格':'读取后显示')+'</small></div>';
 if(read){h+='<div class="cells" aria-label="入站 TTL 共 '+val+' 格">';for(let i=val;i>=1;i--){const used=done&&i===val;h+='<div class="cell'+(used?' used':'')+'"><b>'+i+'</b><small>'+(used?'本跳 −1':done?'剩余':'')+'</small></div>';}h+='</div>';}
 h+='<div class="limits"><span>入站 TTL <b>'+(read?val:'?')+'</b></span>'+(done?'<span>扣减 1</span><span class="verdict'+(fwd?'':' bad')+'">剩余 '+out+(fwd?' → 转发':' → 丢弃')+'</span>':'')+'</div></div>';
 return h+'</div>';
}
function radios(name,choices,selected){return choices.map((v,i)=>'<label class="choice"><input type="radio" name="'+name+'" value="'+i+'" '+(String(i)===selected?'checked':'')+'> '+v+'</label>').join("")}
function render(focus=false){
 const c=context(),{s,r,k,val,out,fwd,right}=c,st=s.cases[r];
 $("chartTitle").textContent="一个包在 R1 的一跳";$("eid").textContent=c.id;
 $("chart").innerHTML=graph(c);$("caption").innerHTML='<b>'+names[k]+'</b>　'+descriptions(c)[k];
 $("log").innerHTML=descriptions(c).slice(0,k+1).map((x,i)=>'<li>'+("02B-"+(r?"V":"M")+"-E"+i)+'　'+x+'</li>').join("");
 let controls="",h='<div class="kicker">02B · '+(r?'迁移':'主例')+'</div>';
 if(s.review){
 h+='<h2>回看'+names[k]+'</h2><p>当前图与记录已恢复到这一刻。</p>'+button("return","返回当前任务",true);
 controls=(k>0?button("prev","上一步"):"")+(k<st.step?button("forward","下一步"):"");
 }else if(s.summary){
 h+='<h2>两轮结果为什么不同？</h2><p>其余条件不变：同一台 R1、同一条有效路由。只把入站 TTL 从 '+vals[0]+' 改为 '+vals[1]+'，① 入站读数首先不同。② 扣减后的值分别为 1 和 0，因此 ③ 出口的判决不同。</p>';
 h+='<div class="stats">主例　'+vals[0]+' − 1 = '+(vals[0]-1)+'　<b>'+results[0]+'</b><br>迁移　'+vals[1]+' − 1 = '+(vals[1]-1)+'　<b>'+results[1]+'</b></div>'+button("reviewM","回看主例")+button("reviewV","回看迁移")+' '+button("reset","重做本任务");
 }else if(k===0){
 h+='<h2>这个包能跨过 R1 吗？</h2><p>'+(r?'仅把入站 TTL 改为 1，其余条件与主例相同。':'一个 IPv4 单播包到达中转路由器 R1。R1 已有有效路由，除 TTL 外没有其他丢包原因。')+'</p><p>先看一个小例：入站 TTL 5，R1 转发时减 1 得 4，4 仍大于零，于是以 TTL 4 发往下一跳。现在用同样的办法处理图中的包。</p>'+button("read","读取入站 TTL",true);
 }else if(k===1){
 h+='<h2>预测 R1 的处理结果</h2><p>读出入站 TTL，再选结果和依据。</p>';
 h+=st.lock?'<div class="stats">处理结果：<span class="keep">'+results[+st.sub]+'</span>（正确，已保留）</div>':'<fieldset><legend>处理结果</legend>'+radios("result",results,st.result)+'</fieldset>';
 const f=st.lock?"follow":"why";
 h+='<fieldset><legend>'+(st.lock?follow:"判断依据")+'</legend>'+radios(f,st.lock?fchoices:whys,st[f])+'</fieldset>';
 h+=(st.msg?'<div class="feedback" role="status">'+st.msg+'</div>':'')+button("submit",st.lock?"提交追问":"提交预测",true);
 if(st.tries)h+=" "+button("explain","查看答案与解析");
 controls=button("back","回看上一步");
 }else{
 const judgment=st.revealed?"已查看解析":(st.tries>1||st.follow!=="")?"修正后答对":"预测正确";
 h+='<h2>'+judgment+' · 正确答案：'+results[right]+'</h2>';
 h+='<p>你的预测：'+results[+st.sub]+'　依据：'+whys[+st.subWhy]+'。</p><p><strong>'+descriptions(c)[2]+'</strong></p><p>依据：扣减后必须仍大于零才可继续转发；有效路由不是本次的决定条件。</p>'+button("next",r?"查看本任务小结":"把入站 TTL 改为 1",true);
 controls=button("readHistory","回看入站读数")+button("resultHistory","回看扣减与判决");
 }
 $("panel").innerHTML=h;$("tools").innerHTML=controls;
 if(focus){const title=$("panel").querySelector("h2");title.tabIndex=-1;title.focus({preventScroll:true});}
}
function grade(){
 const st=progress.cases[progress.round],{out,fwd,right}=context();
 if(st.lock){
  if(!st.follow)st.msg="请选择追问的答案。";
  else if(+st.follow!==FRIGHT)st.msg="入站 TTL 是包到达 R1 时的读数；R1 做转发时才减 1，再看结果是否大于零。";
  else{st.got=true;st.lock=false;st.step=2;}
  return;
 }
 if(st.result==="")st.msg="请选择处理结果。";
 else if(!st.why)st.msg="还需要选择依据。";
 else{
  st.tries++;st.sub=st.result;st.subWhy=st.why;
  if(+st.result!==right){st.got=false;st.msg=fwd?"重新读入站 TTL，先算 R1 扣减 1 后剩多少。":"先算 R1 扣减 1 后剩多少，再看它是否仍大于零。";}
  else if(+st.why!==0){st.lock=true;st.got=false;st.msg="结果正确，已保留。请回答追问来修正依据。";}
  else{st.got=true;st.step=2;}
 }
}
document.addEventListener("change",e=>{const n=e.target.name,st=progress.cases[progress.round];if(["result","why","follow"].includes(n))st[n]=e.target.value;});
document.addEventListener("keydown",e=>{if(e.key!=="Enter"||e.target.tagName==="BUTTON")return;const b=$("panel").querySelector('button[data-action="submit"]');if(b){e.preventDefault();b.click();}});
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 const c=context(),{s,r,k}=c,st=s.cases[r],a=b.dataset.action;
 if(a==="read")st.step=1;
 else if(a==="submit")grade();
 else if(a==="explain"&&st.tries){st.revealed=true;st.step=2;}
 else if(a==="back"||a==="prev")s.review={r,k:k-1};
 else if(a==="forward")s.review={r,k:k+1};
 else if(a==="return")s.review=null;
 else if(a==="next"){if(r===0){s.round=1;}else s.summary=true;}
 else if(a==="readHistory"||a==="resultHistory")s.review={r,k:a==="readHistory"?1:2};
 else if(a==="reviewM"||a==="reviewV")s.review={r:a==="reviewM"?0:1,k:2};
 else if(a==="reset")progress=fresh();
 render(true);
 if((a==="submit"||a==="explain")&&context().k===2)$("panel").scrollIntoView({block:"nearest"});
 else if(matchMedia("(max-width:820px)").matches&&a!=="submit")document.querySelector(".layout").scrollIntoView({block:"start"});
});
render();
</script></body></html>
