<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>封装与分层 · CCNA 01-S1</title>
<style>
:root{--ink:#1e3543;--blue:#174569;--ocean:#0c655d;--mint:#daf0e6;--gold:#92501e;--line:#b9c9ca;--paper:#f6f7f2;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,"PingFang SC","Microsoft YaHei",sans-serif}header{border-bottom:1px solid var(--line);background:#fff}header div,main{width:min(1190px,calc(100% - 40px));margin:auto}header div{padding:13px 0;display:flex;justify-content:space-between;font-size:.9rem}main{padding-bottom:32px}h1{font-size:clamp(2rem,4vw,3.2rem);margin:18px 0 2px;line-height:1.23}h2,h3,p{margin:0}p{margin-bottom:8px}.intro{color:#486472}nav{display:flex;gap:8px;margin:15px 0;flex-wrap:wrap}button,summary{font:inherit;cursor:pointer}button{background:white;border:1px solid #9baead;padding:7px 12px;border-radius:7px;color:inherit}button:hover{background:#eef5f2}button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid #bd661c;outline-offset:2px}button[aria-pressed=true],.primary{background:var(--blue);border-color:var(--blue);color:white;font-weight:650}.primary:hover,button[aria-pressed=true]:hover{background:#204e6c}button:disabled{opacity:.48;cursor:default}.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(310px,1fr);gap:16px;align-items:start}.card,details{background:white;border:1px solid var(--line);border-radius:14px;min-width:0}.card-head{background:#184a4b;color:white;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;border-radius:13px 13px 0 0;gap:10px}.card-head h2{font-size:1.2rem}.event{font:600 .86rem ui-monospace,monospace;white-space:nowrap}.drawing{padding:17px;background:#f2f8f5}.readout{display:block;color:var(--blue);font-weight:700;margin-bottom:13px}.shell{border:2px solid var(--blue);border-radius:11px;padding:11px;background:#e7eff3}.shell.absent,.shell.unknown{border:2px dashed #9eaeb0;background:#fafbf8}.band{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px;font-weight:750}.band small{font:500 .81rem/1.4 ui-monospace,monospace}
.pieces{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr) minmax(56px,.48fr);gap:6px;align-items:stretch}.field,.ip,.tail{border-radius:7px;padding:9px;border:1px solid #9fb9bd;background:#fff;min-width:0}.field,.tail{display:flex;flex-direction:column;justify-content:center;gap:4px}.ip{background:var(--mint);border:2px solid #328577}.ipos{border-top:1px solid #98c6b9;margin-top:7px;padding-top:7px}.payload{border:1px dashed #4b897d;margin-top:7px;text-align:center;border-radius:4px;font-size:.86rem}.code{font:600 .93rem/1.5 ui-monospace,monospace;overflow-wrap:anywhere}.small{font-size:.83rem;color:#445d66}.hot{outline:3px solid var(--gold);outline-offset:-3px;background:#fff0cf;padding:5px}.empty{border-style:dashed;background:#fafbf8;color:#617078}.trace{margin-top:12px;border-left:4px solid var(--gold);padding:7px 10px;background:white;font-weight:650}.tools,.history{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tools button,.history button{font-size:.87rem}.note{padding:11px 16px}.note strong{color:var(--ocean)}.panel{padding:16px 18px}.panel h2{font-size:1.26rem;margin-bottom:7px}.panel p{color:#4c6270}.panel fieldset{border:0;padding:0;margin:8px 0;min-width:0}.panel legend{padding:0;font-weight:700}.opt{display:flex;align-items:center;gap:8px;border:1px solid #bdc9cc;border-radius:7px;padding:7px 9px;margin:5px 0;font-size:.95rem}.opt:has(:checked){border-color:var(--ocean);background:#edf7f2}input{accent-color:var(--ocean)}.feedback{background:#fff0d8;border-left:3px solid var(--gold);padding:6px 10px;margin:7px 0}.panel .primary{margin-top:4px}.summary p{margin:10px 0}details{margin-top:10px;padding:9px 15px}summary{color:var(--blue);font-weight:650}.return{margin-top:9px}.reset{float:right}small{font-size:.87rem}[tabindex="-1"]:focus{outline:0}
@media(max-width:850px){.layout{grid-template-columns:minmax(0,1fr)}header div,main{width:min(700px,calc(100% - 24px))}}
@media(max-width:500px){.drawing{padding:10px}.shell{padding:7px}.pieces{grid-template-columns:minmax(0,.85fr) minmax(0,1.5fr) minmax(36px,.42fr);gap:4px}.field,.ip,.tail{padding:5px}.code{font-size:.85rem}.small{font-size:.8rem}.card-head{padding:10px}.band{margin-bottom:6px}.panel{padding:13px}nav button{font-size:.9rem}.event{font-size:.78rem}}
</style></head>
<body><header><div><strong>CCNA 互动课程</strong><span>01-S1 · OSI 与 TCP/IP</span></div></header><main>
<h1>封装与分层</h1><p class="intro">拆开一帧，找出设备读的地址，再追踪同一个 IPv4 包怎样通过链路。</p>
<nav aria-label="选择任务"><button data-task="A">01A · 定位地址字段</button><button data-task="B">01B · 追踪外层封装</button></nav>
<div class="layout"><section class="card" aria-label="封装剖面图"><div class="card-head"><h2>包与帧的剖面</h2><span id="event" class="event"></span></div><div id="figure" class="drawing"></div><div class="note" id="caption"></div></section><section id="panel" class="card panel" aria-label="学习操作"></section></div>
<details><summary>当前任务的事件记录</summary><div class="history" id="history"></div></details>
<details><summary>读图与术语</summary><p>MAC 地址写在以太网帧头中，用来识别当前链路上的接口。目的 IPv4 地址写在 IP 头中，用于向网络层目的地转发。两种地址可以同时出现在同一帧里。</p><p>这张图只显示本题所需的字段，方框宽度不表示字节数。以太网将 IP 包作为载荷，帧尾包含用于检测差错的帧校验序列 FCS。本课只观察一次交接。</p></details>
</main><script>
"use strict";
const rounds=["主例","迁移"];
const phaseNames=["取证","预测","揭晓"];
const tasks={
 A:{title:"定位地址字段",evidence:["目的 MAC","目的 IPv4 地址"],question:"设备正在按哪一层的字段做判断？",answers:["数据链路层","网络层"],reasons:["从被选字段所在的协议头确定层次","只要是目的地址，就属于同一层"],correctReason:0,results:["目的 MAC → 以太网帧头 → 数据链路层","目的 IPv4 地址 → IP 头 → 网络层"],intro:"同一帧带着两个目的地址。字段的位置告诉你哪层使用它，本轮设备选中了哪一个？",rule:"检查当前字段所在的协议头。帧头界定本链路的交付，IP 头描述网络层目的地。", wrong:"在图中找到带「选中」记号的字段。它位于外层帧头，还是内层 IP 头？",follow:"结果已保留。再确认你的依据：设备是按地址的名称还是按它所在的协议头判断？"},
 B:{title:"追踪外层封装",evidence:["发送端 · IPv4 → 以太网","接收端 · 以太网 → IPv4"],question:"本次交接完成后，包的外面会怎样变化？",answers:["加上以太网帧头和帧尾","去掉以太网帧头和帧尾"],reasons:["发送端和接收端都再添加一层帧头","发送端用帧承载包，接收端向上递交载荷"],correctReason:1,results:["发送端 ↓ 交给以太网 → 帧头与帧尾包住原 IP 包","接收端 ↑ 交给 IPv4 → 帧头与帧尾卸下，原 IP 包保留"],intro:"跟踪一次网络层和以太网之间的交接。先取得方向，再判断外壳会发生什么变化。",rule:"跟踪谁交给谁。向下发送需要链路承载，接收端校验通过后把载荷向上递交。",wrong:"先读交接箭头的起点，再看交接前外壳是否已经存在。",follow:"结果已保留。再选一个依据：内层将交给哪一端的哪一层？"}
};
const blank=()=>({progress:0,view:null,choice:{result:null,reason:null},locked:false,feedback:""});
const state={A:blank(),B:blank()};
let task=location.hash==="#01B"?"B":"A";
const el=id=>document.getElementById(id);
const btn=(action,text)=>'<button type="button" data-action="'+action+'">'+text+'</button>';
const eventID=i=>"01"+task+"-"+(i===6?"END":(i>=3?"V":"M")+(i%3));
function eventName(i){return i===6?"任务小结":rounds[Math.floor(i/3)]+" · "+phaseNames[i%3]}
function field(title,body,sel){return '<div class="'+(sel?'hot':'')+'"><b>'+title+'</b><div class="code">'+body+'</div>'+(sel?'<small>◎ 已选中</small>':'')+'</div>'}
function diagram(i){
 const n=i===6?5:i,r=Math.floor(n/3),phase=n%3,isA=task==="A",known=phase>0,after=phase===2;
 // The sender gains an envelope at reveal; the receiver starts with one and removes it.
 const hasEnvelope = r===0 ? after : !after;
 const shell = isA ? "present" : (!known ? "unknown" : (hasEnvelope ? "present" : "absent"));
 const present=shell==="present", uncertain=shell==="unknown";
 const ip='<section class="ip"><b>IPv4 数据包</b><div class="small">包 P · 内层对象</div><div class="ipos"><small>IP 头</small>'+field("目的 IPv4","192.0.2.8",isA&&known&&r===1)+'</div><div class="payload">载荷</div></section>';
 const left=present?'<strong>帧头</strong>'+field("目的 MAC","02:<wbr>00:<wbr>00:<wbr>00:<wbr>00:<wbr>08",isA&&known&&r===0):'<strong>帧头</strong><small>'+(uncertain?'待观察':'无')+'</small>';
 const tail=present?'<b>帧尾</b><span class="code">FCS</span>':'<b>帧尾</b><small>'+(uncertain?'待观察':'无')+'</small>';
 const title=present?"以太网帧":uncertain?"外层状态待读取":"IP 包 · 当前无链路封装";
 const evidence=known?tasks[task].evidence[r]:"? 待读取";
 let html='<div class="readout">'+(isA?'设备检查的字段':'本次交接方向')+'　'+evidence+'</div><div class="shell '+shell+'"><div class="band"><span>'+title+'</span><small>'+(isA?'同一份帧':!known?'起始快照':after?'交接后':'交接前')+'</small></div><div class="pieces"><div class="field '+(present?'':'empty')+'">'+left+'</div>'+ip+'<div class="tail '+(present?'':'empty')+'">'+tail+'</div></div></div>';
 if(after)html+='<div class="trace">'+tasks[task].results[r]+'</div>';
 if(known)html+='<div class="tools">'+btn("evidence","回看本轮读数")+(after?btn("outcome","定位本轮结果"):"")+'</div>';
 return html;
}
function group(name,title,options){
 const s=state[task],locked=name==="result"&&s.locked;
 return '<fieldset><legend>'+title+'</legend>'+options.map((text,j)=>'<label class="opt"><input type="radio" name="'+name+'" value="'+j+'" '+(s.choice[name]===j?'checked ':'')+(locked?'disabled':'')+'>'+text+'</label>').join("")+'</fieldset>';
}
function primary(action,text){return '<button class="primary" data-action="'+action+'">'+text+'</button>'}
function render(focus=false){
 const s=state[task],t=tasks[task],i=s.view??s.progress,r=Math.min(1,Math.floor(i/3)),p=i%3,review=s.view!==null;
 document.querySelectorAll("[data-task]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.task===task)));
 el("event").textContent=eventID(i);el("figure").innerHTML=diagram(i);
 const notes=task==="A"?["MAC 和 IP 都能写目的地址，观察协议头来判断字段属于哪层。","边框标出当前设备读的字段。另一栏仍可见，它没有被选中。",t.results[r]]:["虚线的外侧区域预留给帧头和帧尾。方向读出后，图中显示交接前的对象。",r===0?"交接还未执行。看清方向和此刻的外层，留意内部的包 P。":"以太网帧已通过校验，即将向上递交。留意此刻的外壳和内部的包 P。",t.results[r]];
 el("caption").innerHTML='<strong>'+eventName(i)+'</strong><div>'+(i===6?"图中保留迁移题终点，可在记录里对照两次结果。":notes[p])+'</div>';
 let h;
 if(review){h='<h2>回看 · '+eventName(i)+'</h2><p>图中恢复这一刻可见的字段。</p><div class="tools">'+(i>0?btn("prev","上一步"):"")+(i<s.progress?btn("forward","下一步"):"")+'</div>'+primary("return","返回当前进度");}
 else if(i===6){h='<h2>'+t.title+' · 已完成</h2><div class="summary"><p>'+t.results[0]+'</p><p>'+t.results[1]+'</p></div><p>'+t.rule+'</p>'+primary("other",task==="A"?"进入 01B · 追踪外层封装":"查看 01A · 定位地址字段");}
 else if(p===0){h='<h2>'+eventName(i)+'</h2><p>'+(r===0?t.intro:task==="A"?"仍观察同一帧，只换设备选中的字段。":"仍跟踪包 P，只改变本次交接方向。")+'</p>'+primary("read",task==="A"?"读取选中字段":"读取交接方向");}
 else if(p===1){h='<h2>'+rounds[r]+'预测</h2>'+group("result",t.question,t.answers)+group("reason","哪条依据支持你的判断？",t.reasons)+(s.feedback?'<div class="feedback" role="status">'+s.feedback+'</div>':'')+primary("submit","提交预测");}
 else{h='<h2>'+rounds[r]+'揭晓</h2><p>'+t.rule+'</p>'+primary("next",r===0?"进入迁移":"查看任务小结");}
 el("panel").innerHTML=h;
 el("history").innerHTML=Array.from({length:i+1},(_,j)=>btn("history-"+j,eventName(j))).join("")+btn("reset","重置本任务");
 if(focus){const heading=el("panel").querySelector("h2");heading.tabIndex=-1;heading.focus({preventScroll:true})}
}
document.addEventListener("change",ev=>{if(ev.target.matches('input[type="radio"]'))state[task].choice[ev.target.name]=Number(ev.target.value)});
document.addEventListener("click",ev=>{
 const b=ev.target.closest("button");if(!b)return;
 if(b.dataset.task){task=b.dataset.task;render(true);return}
 const s=state[task],t=tasks[task],i=s.view??s.progress,base=i>=3?3:0,a=b.dataset.action;
 if(a==="submit"){
  const c=s.choice;
  if(c.result===null||c.reason===null)s.feedback=c.result===null?"请选择预测结果。":"请选择判断依据。";
  else if(c.result!==Math.floor(s.progress/3))s.feedback=t.wrong;
  else if(c.reason!==t.correctReason){s.locked=true;s.feedback=t.follow}
  else{s.progress++;s.feedback=""}
 }else if(a==="next"||a==="read"){s.progress++;s.choice={result:null,reason:null};s.locked=false;s.feedback=""}
 else if(a==="other")task=task==="A"?"B":"A";
 else if(a==="return")s.view=null;
 else if(a==="reset")state[task]=blank();
 else if(a==="evidence")s.view=base+1;
 else if(a==="outcome")s.view=base+2;
 else if(a==="prev")s.view=i-1;
 else if(a==="forward")s.view=i+1;
 else if(a&&a.startsWith("history-"))s.view=Number(a.slice(8));
 render(true);
});
render();
</script></body></html>
