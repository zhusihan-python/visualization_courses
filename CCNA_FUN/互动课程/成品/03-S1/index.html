</style></head><body><header><div><strong>CCNA 互动课程 · 以太网</strong><span>03-S1</span></div></header><main>
<h1>以太网的一次交付</h1><p>先判断链路能否同时双向发送，再为到达的帧选出接收模块。</p>
<nav aria-label="选择独立任务"><button id="tabA" data-task="A">同时发送会怎样 · 03A</button><button id="tabB" data-task="B">载荷交给谁 · 03B</button></nav>
<div class="layout"><section class="card" aria-label="主图与事件"><div class="head"><h2 id="chartTitle"></h2><small id="eid"></small></div><div class="diagram" id="chart"></div><div class="note" id="caption"></div><div class="tools" id="tools"></div></section><section class="card panel" aria-label="课程操作" id="panel"></section></div>
<footer><details><summary>术语与规则</summary><div id="rules"></div></details><details><summary>本轮已观察的事件</summary><ol id="log"></ol></details></footer></main>
<script>
"use strict";
const $=id=>document.getElementById(id);
const tasks={
 A:{title:"同时发送会怎样",nav:"03A",field:"链路工作方式",chart:"两端在同一瞬间各发一个帧",rounds:[
  {value:"共享半双工以太网",short:"共享半双工",ans:["发生碰撞，两端退避后重传","两个方向同时传输，互不影响"],right:0,
   why:["共享半双工下两端争用同一介质，同一时段只容得下一次发送","以太网规定两端都发送时，后开始的帧作废"],follow:"两个箭头是否占用同一介质的同一时间？",fq:["占用同一介质的同一时间","各走一个方向，不争用同一传输机会"],fr:0,
   cause:"两帧落在同一介质、同一时段 → 信号叠加，两端检测到碰撞 → 停止发送，各等一段随机退避时间后重传",
   hint:"重新看链路工作方式：两个发送是否共用同一介质？"},
  {value:"交换式点对点全双工",short:"点对点全双工",ans:["发生碰撞，两端退避后重传","两个方向同时传输，互不影响"],right:1,
   why:["全双工链路两个方向各有独立通道，可同时收发","全双工提高了速率，所以帧跑得更快"],follow:"两个箭头是否占用同一介质的同一时间？",fq:["占用同一介质的同一时间","各走一个方向，不争用同一传输机会"],fr:1,
   cause:"点对点全双工有两个方向通道 → 两帧各走一个方向，互不占用 → 两帧同时完整到达，无需退避",
   hint:"重新看链路工作方式：两个发送是否共用同一介质？"}],
  rule:"<p><b>半双工</b>：同一时刻只能发或只能收。<b>全双工</b>：可同时收发。<b>碰撞</b>是两路信号在同一介质上叠加，使双方的数据都失效；<b>退避</b>指等待一段随机时间再重发。时间轴只表示先后，不按比例。</p><p>小例子：对讲机同一频道同一时刻只能一人说话，两人同时说就互相听不清。</p>",
  start:["两端模式一致，在同一瞬间 t0 各发一个帧。","两端同时开始发送，链路工作方式尚未读取。","两端在 t0 同时发送。结果待预测。"],
  read:"两端在 t0 同时发送。读取链路工作方式后再判断。",
  demo:"小例子：对讲机频道上两人同时说话会互相干扰，因为共用一个频道。现在用同样的思路处理图中的链路。",
  ask:"预测接下来会发生什么"},
 B:{title:"载荷交给谁",nav:"03B",field:"EtherType",chart:"校验正确的 Ethernet II 帧到达",rounds:[
  {value:"0x0806",short:"0x0806",ans:["交给 ARP 处理模块（地址解析）","交给 IPv4 处理模块"],right:0,
   why:["EtherType 字段标识载荷属于哪个上层协议","以太网承载的载荷都交给 IPv4"],follow:"哪一栏直接指定载荷格式？",fq:["EtherType 栏","目的 MAC 栏"],fr:0,
   cause:"EtherType = 0x0806 → 对照协议分派表命中 ARP → 载荷交给地址解析模块；目的 MAC 只决定本机是否接收",
   hint:"重新读取被框出的那一栏，再对照下方两行分派表。"},
  {value:"0x0800",short:"0x0800",ans:["交给 ARP 处理模块（地址解析）","交给 IPv4 处理模块"],right:1,
   why:["EtherType 字段标识载荷属于哪个上层协议","以太网承载的载荷都交给 IPv4"],follow:"哪一栏直接指定载荷格式？",fq:["EtherType 栏","目的 MAC 栏"],fr:0,
   cause:"EtherType = 0x0800 → 对照协议分派表命中 IPv4 → 载荷交给 IPv4 处理模块",
   hint:"重新读取被框出的那一栏，再对照下方两行分派表。"}],
  rule:"<p><b>EtherType</b> 是 Ethernet II 帧中紧随源 MAC 的两字节栏，说明载荷属于哪个上层协议。<b>ARP</b> 用来把 IP 地址解析成 MAC 地址。<b>FCS</b> 是帧尾校验，本例校验正确。</p><p>类型对照：<b>0x0800</b> 表示 IPv4，<b>0x0806</b> 表示 ARP。</p><p>小例子：信封上的“内件类别”写“照片”，收发室就送到照片登记处；写“账单”就送到财务。</p>",
  start:["接收端收到一个校验正确、无标签的 Ethernet II 帧。","帧已到达，EtherType 尚未读取。","帧完整到达。载荷去向待预测。"],
  read:"帧已到达。读取被框出的 EtherType 后再判断。",
  demo:"小例子：信封的“内件类别”决定送到哪个窗口。现在用同样的方法处理图中的帧。",
  ask:"预测载荷会交给谁"}
};
const blank=()=>({step:0,ans:"",why:"",follow:"",lock:false,attempted:false,submitted:"",submittedWhy:"",attempts:0,revealed:false,msg:""});
const fresh=()=>({round:0,cases:[blank(),blank()],summary:false,review:null});
let task=location.hash==="#03B"?"B":"A";
const progress={A:fresh(),B:fresh()};
const names=["起点","读取","揭晓"];
function button(action,title,primary=false){return '<button type="button" data-action="'+action+'" class="'+(primary?'primary':'')+'">'+title+'</button>'}
function context(){
 const s=progress[task],r=s.review?s.review.r:s.round,k=s.review?s.review.k:s.cases[r].step;
 return {s,r,k,d:tasks[task].rounds[r],id:"03"+task+"-"+(r?"V":"M")+"-E"+k};
}
function graphA(c){
 const {k,d}=c,read=k>=1,done=k===2,shared=d.right===0;
 let h='<div class="row" style="justify-content:space-between"><b>A 端</b><span class="mode'+(read?' known':'')+'">链路工作方式：<b>'+(read?d.value:'?')+'</b></span><b>B 端</b></div>';
 h+='<div class="t0">t0　两端同时开始发送</div>';
 if(done&&shared){
 h+='<div class="row"><small>A 的帧</small><div class="arr r"></div><span class="hit"><span>碰撞</span></span><div class="arr l"></div><small style="text-align:right">B 的帧</small></div>';
 h+='<div class="t0">退避之后 · 示例先后</div><div class="row"><small>A 重传</small><div class="arr r later"></div><span class="hit" style="color:var(--green)">到达</span><span style="flex:0 0 8%"></span></div>';
 h+='<div class="row"><small>B 重传</small><span style="flex:0 0 8%"></span><span class="hit" style="color:var(--green)">到达</span><div class="arr l later"></div><small style="text-align:right">B 重传</small></div>';
 h+='<div class="cause bad">'+d.cause+'</div>';
 }else{
 const full=done&&!shared;
 h+='<div class="row"><small>'+(full?'通道 A→B':'A 的帧')+'</small><div class="arr r'+(full?'':' short')+'"></div>'+(full?'<span class="hit" style="color:var(--green)">'+(done?'到达':'')+'</span>':'<div class="gap"></div>')+'</div>';
 h+='<div class="row"><small>'+(full?'通道 B→A':'B 的帧')+'</small>'+(full?'<span class="hit" style="color:var(--green)">'+(done?'到达':'')+'</span>':'<div class="gap"></div>')+'<div class="arr l'+(full?'':' short')+'"></div><small style="text-align:right">B 的帧</small></div>';
 if(done)h+='<div class="cause">'+d.cause+'</div>';
 }
 return h+'<div class="scale">箭头只表示方向与先后，长度不按比例。</div>';
}
function graphB(c){
 const {k,d}=c,read=k>=1,done=k===2;
 let h='<div class="frame" aria-label="以太网帧字段"><div class="cell">目的<small>MAC</small></div><div class="cell">源<small>MAC</small></div><div class="cell type">EtherType<small>'+(read?d.value:'?')+'</small></div><div class="cell">载荷</div><div class="cell">FCS</div></div>';
 h+='<div class="link"></div>';
 if(read){
 const rows=[["0x0800","IPv4 处理模块"],["0x0806","ARP 处理模块（地址解析）"]];
 h+='<div class="table"><div class="tr hd"><span>EtherType</span><span>载荷交给</span></div>'+rows.map(x=>'<div class="tr'+(done&&(d.right===0)===(x[0]==="0x0806")?' on':'')+'"><span class="mono">'+x[0]+'</span><span>→ <b>'+x[1]+'</b></span></div>') .join('')+'</div>';
 if(done)h+='<div class="cause">'+d.cause+'</div>';
 }else h+='<div class="table hidden">读取字段后可查协议分派表</div>';
 return h;
}
function radios(name,choices,selected){return choices.map((v,i)=>'<label class="choice"><input type="radio" name="'+name+'" value="'+i+'" '+(String(i)===selected?'checked':'')+'> '+v+'</label>').join("")}
function render(focus=false){
 const c=context(),{s,r,k,d}=c,t=tasks[task],st=s.cases[r];
 $("tabA").setAttribute("aria-pressed",task==="A");$("tabB").setAttribute("aria-pressed",task==="B");
 $("chartTitle").textContent=t.chart;$("eid").textContent=c.id;$("rules").innerHTML=t.rule;
 $("chart").innerHTML=task==="A"?graphA(c):graphB(c);
 const reading=t.field+"："+d.value+"。处理结果待预测。";
 const cap=k===0?t.start[0]:k===1?reading:d.cause;
 $("caption").innerHTML='<b>'+names[k]+'</b>　'+cap;
 $("log").innerHTML=[t.start[0],reading,k===2?d.cause:""].slice(0,k+1).map((x,i)=>'<li>'+c.id.slice(0,-1)+i+'　'+x+'</li>').join("");
 let controls="",h='<div class="kicker">'+t.nav+' · '+(r?'迁移':'主例')+'</div>';
 if(s.review){
 h+='<h2>回看：'+names[k]+'</h2><p>主图与记录已恢复到这一刻。</p>'+button("return","返回当前任务",true);
 controls=(k>0?button("prev","上一步"):"")+(k<st.step?button("forward","下一步"):"");
 }else if(s.summary){
 h+='<h2>两轮为什么不同？</h2><p>'+(task==="A"?'只把链路工作方式从共享半双工换成点对点全双工：决定结果的是双方是否争用同一传输机会，而不是“是否同时发送”。':'只把 EtherType 从 0x0806 换成 0x0800：决定载荷去向的是 EtherType，而不是“以太网都交给 IPv4”。')+'</p><div class="stats">主例：<b>'+t.rounds[0].ans[t.rounds[0].right]+'</b><br>迁移：<b>'+t.rounds[1].ans[t.rounds[1].right]+'</b></div>'+button("reviewM","回看主例")+button("reviewV","回看迁移")+' '+button("reset","重做本任务")+' '+button("other",task==="A"?"进入 03B":"进入 03A");
 }else if(k===0){
 h+='<h2>'+(task==="A"?'双方同一时刻发送会怎样？':'帧的载荷应交给谁？')+'</h2><p>'+(r?'与上一轮相比，只改变了'+t.field+'。':'')+(task==="A"?'A、B 两端模式一致，在同一瞬间各发一个帧。':'接收端收到一个校验正确、无标签的 Ethernet II 帧。')+'</p><p>'+t.demo+'</p>'+button("read","读取"+t.field,true);
 }else if(k===1){
 h+='<h2>'+t.ask+'</h2><p>先选结果，再选依据，然后提交。</p>';
 h+='<fieldset'+(st.lock?' disabled':'')+'><legend>结果</legend>'+radios("ans",d.ans,st.ans)+'</fieldset>';
 h+=st.lock?'<fieldset><legend>'+d.follow+'</legend>'+radios("follow",d.fq,st.follow)+'</fieldset>':'<fieldset><legend>依据</legend>'+radios("why",d.why,st.why)+'</fieldset>';
 h+=(st.msg?'<div class="feedback" role="status">'+st.msg+'</div>':'')+button("submit",st.lock?"提交追问":"提交预测",true);
 if(st.attempted)h+=" "+button("explain","查看答案与解析");
 controls=button("back","回看起点");
 }else{
 const judgment=st.revealed?"已查看解析":st.lock||st.attempts>1?"修正后答对":"预测正确";
 h+='<h2><span class="tag'+(st.revealed?" seen":"")+'">'+judgment+'</span></h2><p>你的预测：'+d.ans[st.submitted]+'；依据：'+d.why[st.submittedWhy]+'</p><p><strong>正确答案：'+d.ans[d.right]+'</strong></p><p>依据：'+d.why[0]+'。</p><p><strong>因果：</strong>'+d.cause+'。</p>'+button("next",r?"查看本任务小结":"改变"+t.field,true);
 controls=button("readHistory","回看取证")+button("resultHistory","回看揭晓");
 }
 $("panel").innerHTML=h;$("tools").innerHTML=controls;
 if(focus){const title=$("panel").querySelector("h2");title.tabIndex=-1;title.focus({preventScroll:true});}
}
function grade(){
 const {s,r,d}=context(),st=s.cases[r];
 if(!st.lock&&st.ans!==""&&st.why!==""){st.attempted=true;st.submitted=st.ans;st.submittedWhy=st.why;st.attempts++;}
 if(st.lock){
 if(!st.follow)st.msg="请选择追问的答案。";
 else if(Number(st.follow)!==d.fr)st.msg=task==="A"?"对照主图：两个箭头是否落在同一介质上？":"对照主图：哪一栏写着协议类型？";
 else st.step=2;
 }else if(!st.ans)st.msg="还需要选择结果。";
 else if(!st.why)st.msg="结果已保留，还需要选择依据。";
 else if(Number(st.ans)!==d.right)st.msg=d.hint;
 else if(Number(st.why)!==0){st.lock=true;st.msg="结果正确，已保留。请回答追问来修正依据。";}
 else st.step=2;
}
document.addEventListener("change",e=>{const s=progress[task],st=s.cases[s.round];if(["ans","why","follow"].includes(e.target.name))st[e.target.name]=e.target.value;});
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 const c=context(),{s,r,k}=c,st=s.cases[r],a=b.dataset.action;
 if(b.dataset.task)task=b.dataset.task;
 else if(a==="read")st.step=1;
 else if(a==="submit")grade();
 else if(a==="explain"&&st.attempted){st.revealed=true;st.step=2;}
 else if(a==="back"||a==="prev")s.review={r,k:k-1};
 else if(a==="forward")s.review={r,k:k+1};
 else if(a==="return")s.review=null;
 else if(a==="next"){if(r===0)s.round=1;else s.summary=true;}
 else if(a==="readHistory"||a==="resultHistory")s.review={r,k:a==="readHistory"?1:2};
 else if(a==="reviewM"||a==="reviewV")s.review={r:a==="reviewM"?0:1,k:2};
 else if(a==="reset")progress[task]=fresh();
 else if(a==="other")task=task==="A"?"B":"A";
 render(true);
 if((a==="submit"||a==="explain")&&context().k===2)$("panel").scrollIntoView({block:"nearest"});
 else if(matchMedia("(max-width:820px)").matches&&a!=="submit")document.querySelector(".layout").scrollIntoView({block:"start"});
