<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>二分查找 · 两份微课对照</title>
<style>
:root{color-scheme:light;--ink:#172321;--muted:#536461;--line:#c7d2cc;--green:#14664f;--paper:#f4f7f3;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:var(--paper);font:16px/1.6 "Inter","PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:1500px;margin:auto;padding:38px clamp(16px,4vw,76px) 46px}
h1,h2,h3,p{margin:0} h1{font-weight:680;letter-spacing:-.045em;font-size:clamp(32px,4.4vw,62px);line-height:1.15}
h2{font-size:clamp(22px,2.4vw,36px);letter-spacing:-.04em;line-height:1.2}
h3{font-size:17px} a{color:var(--green);text-underline-offset:4px}
header p{margin-top:12px;color:var(--muted)}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-block:1px solid var(--line);padding:13px 0;margin:24px 0 18px}
.toolbar strong{margin-right:5px}
button,select,input,textarea{font:inherit;color:inherit}
button,select,input,textarea{border:1px solid var(--line);border-radius:5px;background:white}
button{cursor:pointer;padding:7px 12px;line-height:1.4}
button:hover:enabled,summary:hover{border-color:var(--green);color:var(--green)}
button:focus-visible,a:focus-visible,summary:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #ec972d;outline-offset:2px}
button[aria-pressed=true],.primary{background:var(--ink);border-color:var(--ink);color:#fff}
button[aria-pressed=true]:hover:enabled,.primary:hover:enabled{color:white;background:var(--green)}
button:disabled{opacity:.5;cursor:default}
.restart{margin-left:auto}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(14px,2vw,30px);align-items:start}
article{background:white;border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.panelhead,.content{padding:20px clamp(14px,1.8vw,28px)}
.panelhead{border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.panelhead p,.hint,footer{color:var(--muted);font-size:14px}.panelhead a{font-size:14px;white-space:nowrap}
.meta,.nav,.logrow,.diagram-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.step{color:var(--green);font:600 13px var(--mono)}.lead{font-size:20px;margin:3px 0 12px}
.board{background:#eff5f1;border:1px solid #d6e1d9;border-radius:7px;padding:13px clamp(8px,1vw,18px);margin:12px 0}
.diagram-head{font-size:14px}.array,.bracegrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.array{margin:8px 0 0}.slot{text-align:center;display:flex;flex-direction:column;align-items:stretch;min-width:0}
.idx,.marker{font:12px/20px var(--mono);height:20px;color:#485c53}
.num{display:grid;place-items:center;width:100%;height:clamp(42px,4.5vw,68px);border:1px solid #7e998c;border-radius:4px;color:#173e2b;background:white;font:600 clamp(18px,2.2vw,31px) var(--mono);padding:0}
.sol .out .num{background:repeating-linear-gradient(135deg,#e4eae5 0px,#e4eae5 4px,#d5ded7 4px,#d5ded7 5px);color:#43584c}
.glm .out .num{background:#dce4de;text-decoration:line-through;color:#485c53;cursor:pointer}
.sol .mid .num{border:4px double var(--green)} .found .num{background:#17644d;color:#fff}
.marker{color:var(--green);font-family:inherit;font-weight:bold;white-space:nowrap}
.bracegrid{height:29px;margin-top:2px}.brace{border:solid var(--green);border-width:0 1px 2px;height:7px;text-align:center;font-size:12px;color:var(--green)}.brace span{position:relative;top:8px}
.glm .bounds{display:flex;align-items:center;justify-content:space-between;font:12px var(--mono);color:#3b5448;min-height:30px}.blocks{letter-spacing:1px}
.evidence{font-size:14px;min-height:3.2em;padding-top:5px}.nav{padding:8px 0;justify-content:flex-start}
details{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}summary{cursor:pointer;font-weight:600}
.logrow{width:100%;margin-top:4px;text-align:left;font-size:14px}.logrow[aria-current=step]{border-color:var(--green);background:#eaf3eb}
.quiz{margin:12px 0 0;padding:14px;border-left:3px solid var(--green);background:#f7f8f3}
.quiz label{display:block;margin:7px 0;font-size:14px}.quiz select,.quiz textarea{display:block;width:100%;padding:5px 7px;margin-top:3px}
.quiz textarea{min-height:48px;resize:vertical}.feedback{color:#294d3d;padding:6px 0}
footer{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
@media(max-width:820px){.pair{grid-template-columns:1fr}.restart{margin-left:0}.toolbar{gap:6px}main{padding-top:24px}}
</style>
</head>
<body><main>
<header><h1>二分查找 · 微课对照</h1><p>同一个升序数组，两种讲法。先看第一次比较：左边停下来请你预测，右边已经缩小了候选范围。</p></header>
<nav class="toolbar" aria-label="评审定位"><strong>对齐观察点</strong>
<button data-pair="first">第一次比较</button><button data-pair="second">第二次比较</button><button data-pair="last">最后一格</button><button class="restart" data-pair="start">从头分别试学</button></nav>
<div class="pair"><article id="sol" class="sol" aria-label="GPT-6.2 Sol 课程"></article><article id="glm" class="glm" aria-label="GLM-5.3 课程"></article></div>
<footer>根据两份 Markdown 原稿实现。顶部定位用于评审，可跳过答题；每栏的“下一步”用于独立试学。事件编号沿用各自原稿。 <a href="评审.md">阅读原评审</a></footer>
</main>
<script>
'use strict';
const values=[3,7,11,18,25,31,42];
function frame(target,lo,hi,mid,title,note,found=false){return {target,lo,hi,mid,title,note,found}}
const start=t=>frame(t,0,6,null,'圈定全部候选','已知数组按从小到大排列。只比较一格，怎样判断一整侧？');
const compare=t=>frame(t,0,6,3,'读出中间值','下标 3 的值是 18。此时还没有更新候选范围。');
const cutLeft=t=>frame(t,4,6,3,'排除左侧四格','下标 0 至 3 的值都 ≤ 18，而 18 < '+t+'。这四格都可以排除。');
const cutRight=t=>frame(t,4,4,5,'排除右侧两格','下标 5 至 6 的值都 ≥ 31，而 31 > '+t+'。只剩下标 4。');
const hit=()=>frame(25,4,4,4,'找到目标','下标 4 的值等于目标 25，第三次比较后结束。',true);
const beforeMiss=()=>frame(24,4,4,4,'比较最后一格','下标 4 的值是 25，目标是 24。若要继续向左找，还有候选格吗？');
const miss=()=>frame(24,4,3,4,'排除最后一格','将右端更新为 3，左端仍为 4。左端超过右端，候选范围为空。');
const end=()=>frame(24,4,3,null,'确认目标不存在','三次比较分别排除了下标 0–3、5–6 和 4。七格都已排除。');
const lessons={
 sol:{name:'GPT-6.2 Sol',file:'GPT-6.2-Sol.md',sub:'分开比较与更新，先预测再揭晓',events:[start(25),compare(25),cutLeft(25),cutRight(25),hit(),start(24),cutLeft(24),cutRight(24),beforeMiss(),miss()]},
 glm:{name:'GLM-5.3',file:'GLM-5.3.md',sub:'合并比较与更新，逐格追查排除依据',events:[start(25),cutLeft(25),cutRight(25),hit(),start(24),cutLeft(24),cutRight(24),miss(),end()]}
};
const checkpoints={first:[1,1],second:[3,2],last:[8,6],start:[0,0]};
function initial(){return {i:0,max:0,answers:{},cell:null,log:false}}
const states={sol:initial(),glm:initial()};
const field=(label,choices,answer)=>({label,choices,answer});
const lastQuestion={title:'排除最后一格后，范围是什么？',fields:[field('选择下一范围',['[4, 4]','[4, 3]','[3, 4]'],'[4, 3]')],reason:'为什么可以断定 24 不在数组里？',key:'左端 4 超过右端 3。其他六格在之前的比较中已经排除。'};
const quizzes={
 sol:{1:{title:'下一次该保留哪些格子？',fields:[field('选择候选范围',['[3, 6]','[0, 2]','[4, 6]'],'[4, 6]')],reason:'为什么没有逐格比较也能排除它们？',key:'升序保证左侧值都 ≤ 18；18 < 25，因此排除下标 0–3。'},8:lastQuestion},
 glm:{1:{title:'预测第二次比较的两个分支',fields:[field('下一个中点下标',['4','5','6'],'5'),field('若中间值大于 25，保留',['[4, 4]','[4, 5]','[6, 6]'],'[4, 4]'),field('若中间值小于 25，保留',['[4, 4]','[5, 6]','[6, 6]'],'[6, 6]')],key:'中点为 5。本例实际读到 31，保留 [4, 4]；小于 25 是假设分支。'},6:lastQuestion}
};
function range(e){return '['+e.lo+', '+e.hi+']'}
function quizHTML(id){
 const s=states[id], q=quizzes[id][s.i];if(!q)return '';
 const answer=s.answers[s.i];
 if(answer)return '<div class="quiz"><h3>预测对照</h3><p>'+answer.marks.join(' · ')+'</p><p class="feedback">'+q.key+'</p>'+(q.reason?'<p class="hint">请将自己提交的理由与这条依据对照。</p><output class="own"></output>':'')+'</div>';
 return '<form class="quiz"><h3>'+q.title+'</h3>'+q.fields.map((f,j)=>'<label>'+f.label+'<select name="q'+j+'" required><option value="">请选择</option>'+f.choices.map(v=>'<option>'+v+'</option>').join('')+'</select></label>').join('')+(q.reason?'<label>'+q.reason+'<textarea name="reason" required></textarea></label>':'')+'<button class="primary">提交预测</button></form>';
}
function board(id,e){
 const s=states[id], isSol=id==='sol';
 const boxes=values.map((v,j)=>{
  const out=j<e.lo||j>e.hi,mid=j===e.mid,tag=out&&!isSol?'button':'span';
  const marker=e.found&&mid?'找到':mid?(isSol?'中间':'▼ mid'):'';
  const index='<span class="idx">'+j+'</span>';
  const value='<'+tag+' class="num" '+(tag==='button'?'data-cell="'+j+'" aria-label="查看下标 '+j+' 的排除依据"':'')+'>'+v+'</'+tag+'>';
  return '<div class="slot '+(out?'out ':'')+(mid?'mid ':'')+(e.found&&mid?'found':'')+'"><span class="marker">'+marker+'</span>'+(isSol?index+value:value+index)+'</div>';
 }).join('');
 const count=Math.max(0,e.hi-e.lo+1);
 const bottom=isSol?'<div class="bracegrid">'+(count?'<div class="brace" style="grid-column:'+ (e.lo+1)+' / span '+count+'"><span>候选</span></div>':'<span style="grid-column:1/-1">空范围</span>')+'</div>':'<div class="bounds"><span>low '+e.lo+'　high '+e.hi+'</span><span class="blocks" aria-label="候选数 '+count+'">'+ '■'.repeat(count)+'□'.repeat(7-count)+'</span></div>';
 let evidence=e.note;
 if(!isSol && s.cell!==null){
  const j=s.cell;
  const when=lessons.glm.events.findIndex((f,k)=>k<=s.i && f.target===e.target&&(j<f.lo||j>f.hi));
  const cause=lessons.glm.events[when];
  if(cause){const v=values[cause.mid];evidence='下标 '+j+' · E'+(when+1)+' 首次排除。'+(j<cause.lo? values[j]+' ≤ '+v+' < '+e.target:values[j]+' ≥ '+v+' > '+e.target)+'。';}
 }
 return '<section class="board"><div class="diagram-head"><strong>升序数组</strong><span>候选 '+range(e)+' · '+count+' 格</span></div><div class="array">'+boxes+'</div>'+bottom+'<p class="evidence" aria-live="polite">'+evidence+'</p></section>';
}
function draw(id){
 const l=lessons[id],s=states[id],e=l.events[s.i],isSol=id==='sol';
 const blocked=quizzes[id][s.i]&&!s.answers[s.i];
 const rows=l.events.map((f,j)=>({f,j})).filter(({f,j})=>isSol?j<=s.max:(f.target===e.target)).map(({f,j})=>'<button class="logrow" data-jump="'+j+'" '+(j===s.i?'aria-current="step"':'')+'><span>E'+(j+1)+'　'+f.title+'</span><span>'+range(f)+'</span></button>').join('');
 const last=s.i===l.events.length-1;
 const closing=last?'<p><strong>结论</strong>　升序决定哪侧可以排除，中点保证每次比较不相等时最多留下原候选数的一半。</p>':'';
 const recall=!isSol&&s.i===3?'<details><summary>为什么可以一次划掉下标 0–3？</summary><p>升序保证这四格都 ≤ 18，而 18 < 25。回看 E2 可逐格查看依据。</p></details>':'';
 const extra=!isSol&&last?'<details><summary>选做：改找 19，第一次比较后保留哪里？</summary><p>19 > 18，因此保留下标 4–6。</p></details>':'';
 const panel=document.getElementById(id);
 panel.innerHTML='<div class="panelhead"><div><h2>'+l.name+'</h2><p>'+l.sub+'</p></div><a href="'+l.file+'">原稿</a></div><div class="content"><div class="meta"><span class="step">E'+(s.i+1)+' / '+l.events.length+'</span><strong>目标 '+e.target+'</strong></div><h3 class="lead">'+e.title+'</h3>'+board(id,e)+('<p class="hint">'+(isSol?'括线标出候选区间，斜线标出已经排除的格子。':'点已划掉的数值，可追溯首次排除它的事件。')+'</p>')+'<div class="nav"><button data-step="-1" '+(s.i===0?'disabled':'')+'>上一步</button><button class="primary" data-step="1" '+(blocked||last?'disabled':'')+'>'+(!isSol&&s.i===3?'进入迁移题':'下一步')+'</button></div>'+quizHTML(id)+closing+recall+extra+'<details class="log" '+(s.log?'open':'')+'><summary>事件记录</summary>'+rows+'</details></div>';
 if(panel.querySelector('.own')) panel.querySelector('.own').textContent=s.answers[s.i].reason;
 panel.querySelector('.log').ontoggle=ev=>{s.log=ev.currentTarget.open};
}
function move(id,i){
 const s=states[id];s.i=i;s.max=Math.max(s.max,i);s.cell=null;draw(id);
}
function mark(name){
 document.querySelectorAll('[data-pair]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.pair===name)));
}
function align(name){
 const pos=checkpoints[name];
 ['sol','glm'].forEach((id,n)=>{if(name==='start')states[id]=initial();move(id,pos[n])});
 mark(name);
}
document.addEventListener('click',ev=>{
 const b=ev.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.pair){align(b.dataset.pair);return;}
 const panel=b.closest('article');if(!panel)return;
 const id=panel.id,s=states[id];
 if(b.hasAttribute('data-cell')){
  s.cell=Number(b.dataset.cell);
  const temp=document.createElement('template');
  temp.innerHTML=board(id,lessons[id].events[s.i]);
  panel.querySelector('.evidence').textContent=temp.content.querySelector('.evidence').textContent;
 }
 if(b.hasAttribute('data-step')){mark(null);move(id,s.i+Number(b.dataset.step));}
 if(b.hasAttribute('data-jump')){mark(null);move(id,Number(b.dataset.jump));}
});
document.addEventListener('submit',ev=>{
 ev.preventDefault();
 const form=ev.target,id=form.closest('article').id,s=states[id],q=quizzes[id][s.i],data=new FormData(form);
 const reason=String(data.get('reason')||'').trim();
 if(q.reason&&!reason){form.elements.reason.focus();return;}
 const marks=q.fields.map((f,j)=>{const v=data.get('q'+j);return f.label+'：'+v+(v===f.answer?' ✓':'（应为 '+f.answer+'）')});
 s.answers[s.i]={marks,reason};draw(id);
});
align('first');
</script>
</body></html>
