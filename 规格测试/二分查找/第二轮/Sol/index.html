<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>二分查找 · 候选区间</title>
<style>
:root{color-scheme:light;--ink:#182633;--muted:#526273;--paper:#fffdf8;--line:#d9d4c8;--accent:#14594f;--mint:#e0f3ea}
*{box-sizing:border-box}body{margin:0;background:#f1eee6;color:var(--ink);font:16px/1.65 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:34px 18px 52px}header{border-top:5px solid var(--accent);padding:18px 0 22px}h1,h2,p{margin:0}h1{font-size:clamp(29px,5vw,50px);line-height:1.18;margin:.28em 0}h2{font-size:1.3rem}.meta,.secondary,summary{color:var(--muted)}.rule{background:var(--mint);border-left:4px solid var(--accent);padding:12px 16px;margin-top:16px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:clamp(12px,3vw,26px);box-shadow:0 6px 24px #24200f09}.event{color:var(--accent);font-weight:700}.array{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:clamp(3px,1vw,10px);margin:16px 0 10px}.cell{min-width:0;text-align:center}.tile{width:100%;min-height:51px;background:white;border:1px solid #7d8992;border-radius:8px;font-size:clamp(17px,3.5vw,30px);font-weight:700}.out .tile{border-style:dashed;background:#efede7;color:#52565a}.probe .tile{border:3px double var(--accent);background:var(--mint)}.cell small{display:block;font-size:clamp(9px,1.7vw,13px);min-height:42px;line-height:1.3;padding-top:5px}.tile.picked{outline:3px solid #245a9a;outline-offset:2px}.state{font-weight:700}.task{margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:10px;background:#fbfaf6}fieldset{border:0;padding:0;margin:8px 0 14px}legend{font-weight:700;margin-bottom:3px}label{display:block;padding:3px 0}input{accent-color:var(--accent)}button{font:inherit;color:inherit}button:not(:disabled),summary{cursor:pointer}button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid #245a9a;outline-offset:3px}.control{border:1px solid var(--accent);border-radius:7px;background:white;padding:6px 12px;font-weight:650}.primary{background:var(--accent);color:white}.control:disabled{opacity:.45}nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}details{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}ol{margin:7px 0;padding-left:25px}li{margin:4px 0}[aria-current=step]{background:var(--mint);font-weight:700}.feedback{margin-top:8px}.result{margin-top:12px;font-weight:700}
</style>
</head>
<body><main>
<header>
<p class="meta">算法微课 · 约 6 分钟 · 已学过数组和下标</p>
<h1>比较一次，为什么能排除一半？</h1>
<p>你要从七个升序数字中找出 25 的下标。刚开始七项都可能，找到目标或候选项用尽时结束。</p>
<p class="rule">先记住一条可用来预测的规则：目标比中点大，就查中点右边；目标比中点小，就查中点左边；相等就找到了。每次比较都依据当前候选区间的升序关系。</p>
</header>
<section class="panel" aria-label="二分查找实验">
<div id="scene" aria-live="polite"></div>
<div id="exercise"></div>
<nav aria-label="单步控制"><button id="back" class="control">上一步</button><button id="next" class="control primary">下一步</button></nav>
<details id="record"><summary>事件记录与跳转</summary><ol id="events"></ol></details>
<details id="detail"><summary>当前事件详情</summary><p id="fields"></p></details>
</section>
<p class="meta" style="margin-top:14px">示例数据 · 零基下标 · 区间含两端 · 每步是一项教学动作，事件编号只表示先后。</p>
</main>
<script>
"use strict";
const values = [3,7,11,18,25,31,42];
const steps = [
  [25,0,6,null,"圈定候选区间","从下标 0 到 6 开始，七个位置都有可能。L 和 R 分别标出候选区间的左、右端。","开始查找，候选区间为 [0, 6]。"],
  [25,0,6,3,"读出中点，预测去向","中点取两端下标平均值并向下取整。此时中点下标是 3，值是 18。看看目标和中点的大小，再用升序判断一整侧。","读取 A[3] = 18。目标是 25，候选区间仍为 [0, 6]。"],
  [25,4,6,3,"排除中点及左侧","25 > 18。升序意味着下标 0 到 3 的值都 ≤ 18，所以一定找不到 25。点任一刚排除的格子可回看这次变化。","比较 25 与 18，左端 L 从 0 移到 4，候选项从 7 个减至 3 个。"],
  [25,4,4,5,"比较新中点，收紧右端","当前区间 [4, 6] 的中点下标是 5，值是 31。25 < 31，而下标 5 到 6 的值都 ≥ 31，所以剩下 [4, 4]。","读取 A[5] = 31 并比较。右端 R 从 6 移到 4，候选项从 3 个减至 1 个。"],
  [25,4,4,4,"确认命中","唯一候选项 A[4] = 25，比较相等，返回下标 4。","读取 A[4] = 25，找到目标，查找结束。"],
  [24,0,6,3,"换一个目标，沿用规则","同一数组、同一起点，目标改成 24。初始候选区间仍是 [0, 6]，中点仍是下标 3，值是 18。","重新开始并读取 A[3] = 18。目标是 24，候选区间仍为 [0, 6]。"],
  [24,4,6,3,"验证排除方向","24 > 18。下标 0 到 3 的值都 ≤ 18，仍然可以安全排除。","比较 24 与 18，左端 L 从 0 移到 4。候选项从 7 个减至 3 个。"],
  [24,4,4,4,"定位最后一个候选","24 < A[5] = 31，而下标 5 到 6 的值都 ≥ 31。现在只剩下标 4。读出该格的值，预测比较后的区间。","右端 R 从 6 移到 4。候选项从 3 个减至 1 个。下一比较点 A[4] = 25。"],
  [24,4,3,4,"候选用尽，结束查找","24 < A[4] = 25。最后一个候选也已排除，L = 4 大于 R = 3，说明数组中没有 24。","右端 R 从 4 移到 3。候选项从 1 个减至 0 个。"]
];
const $ = id => document.getElementById(id);
const predictions = {1:{choice:"",reason:"",cell:null,feedback:"",passed:false},7:{choice:"",reason:"",cell:null,feedback:"",passed:false}};
let current = 0;
let frontier = 0;
function go(index) {
  current = index;
  frontier = Math.max(frontier,index);
  render();
  $("heading").focus();
}
function removedAt(index) {
  if(current >= 2 && current <= 4) return index <= 3 ? 2 : current >= 3 && index >= 5 ? 3 : null;
  if(current >= 6) return index <= 3 ? 6 : current >= 7 && index >= 5 ? 7 : current === 8 && index === 4 ? 8 : null;
  return null;
}
function render() {
  const [target,left,right,mid,title,story,fields] = steps[current];
  const prediction = predictions[current];
  const active = prediction && !prediction.passed;
  const boundary = current === 7;
  const choices = boundary ? ["[4, 4]","[4, 5]","空区间"] : ["[0, 2]","[3, 6]","[4, 6]"];
  const reasons = boundary ? [["equal","唯一候选的值等于目标"],["right","唯一候选的值大于目标，当前区间内没有更靠左的候选"],["outside","下标 3 的值更小，应重新加入候选"]] : [["left","中点及其左侧的值都不大于中点值"],["right","中点及其左侧的值都不小于中点值"],["single","中点值与目标不同，只能说明中点不匹配"]];
  const tiles = values.map((value,index) => {
    const inside = index >= left && index <= right;
    const removed = removedAt(index);
    const enabled = active || removed !== null;
    const tags = [index === left && inside ? "L" : "",index === right && inside ? "R" : "",index === mid ? "比较点" : "",inside ? "候选" : "已排除"].filter(Boolean).join(" · ");
    return `<div class="cell ${inside ? "" : "out"} ${index === mid ? "probe" : ""}"><div class="secondary">${index}</div><button class="tile ${active && prediction.cell === index ? "picked" : ""}" type="button" data-index="${index}" ${enabled ? "" : "disabled"} ${active ? 'aria-pressed="' + (prediction.cell === index) + '"' : ""} aria-label="下标 ${index}，值 ${value}，${tags}${!active && enabled ? '，回看排除事件' : ''}">${value}</button><small>${tags}</small></div>`;
  }).join("");
  $("scene").innerHTML = `<p class="event">E${current+1} · 目标 ${target}</p><h2 id="heading" tabindex="-1">${title}</h2><p>${story}</p><div class="array" aria-label="数组，上方为下标">${tiles}</div><p class="state">${left <= right ? '候选区间 ['+left+', '+right+'] · '+(right-left+1)+' 项' : '候选区间为空 · 0 项（L = 4，R = 3）'}</p>${current === 8 ? '<p class="result">结论：升序把一次中点比较变成了对整侧的界限。排除中点和一整侧后，剩余候选最多是原来的一半（向下取整）。</p>' : ''}`;
  $("fields").textContent = `E${current+1} · 查找程序 · ${fields}`;
  $("events").innerHTML = steps.slice(0,frontier+1).map((item,i)=>`<li><button class="control" type="button" data-event="${i}" ${current===i ? 'aria-current="step"' : ''}>E${i+1} · ${item[4]}</button></li>`).join("");
  $("back").disabled = current === 0;
  $("next").disabled = !!active || current === steps.length-1;
  $("next").textContent = current === 4 ? "换目标：查找 24" : "下一步";
  $("exercise").innerHTML = active ? `<form class="task" id="question">
  <fieldset><legend>1. 哪个区间应留到下一次？</legend>
  ${choices.map(value=>`<label><input type="radio" required name="choice" value="${value}" ${prediction.choice===value?"checked":""}> ${value}</label>`).join("")}</fieldset>
  <fieldset><legend>2. 点选上面作为比较依据的格子，再选出支持这个范围的依据。</legend>
  ${reasons.map(([value,label])=>`<label><input type="radio" required name="reason" value="${value}" ${prediction.reason===value?"checked":""}> ${label}</label>`).join("")}</fieldset>
  <button class="control primary">提交预测</button><p class="feedback" role="status">${prediction.feedback}</p></form>` : prediction ? '<p class="result">区间和依据均正确。选择「下一步」可再看揭晓事件。</p>' : "";
}
$("scene").addEventListener("click",event=>{
  const button = event.target.closest("[data-index]");
  if(!button) return;
  const index = Number(button.dataset.index);
  const prediction = predictions[current];
  if(prediction && !prediction.passed) {
    prediction.cell = index;
    for(const tile of $("scene").querySelectorAll(".tile")){
      const picked = tile === button;
      tile.classList.toggle("picked",picked);
      tile.setAttribute("aria-pressed",String(picked));
    }
  } else if(removedAt(index) !== null) go(removedAt(index));
});
$("exercise").addEventListener("submit",event=>{
  event.preventDefault();
  const prediction = predictions[current];
  const data = new FormData(event.target);
  prediction.choice = data.get("choice");
  prediction.reason = data.get("reason");
  const boundary = current === 7;
  const correct = prediction.choice === (boundary ? "空区间" : "[4, 6]");
  if(!correct) {
    prediction.feedback = boundary ? "重新比较 24 和唯一候选项的值。区间内还有位置可以保留吗？" : "区间需要调整。先比较目标和中点：哪一侧的值会更小？中点自己还有可能等于目标吗？";
  } else if(prediction.cell !== (boundary ? 4 : 3) || prediction.reason !== (boundary ? "right" : "left")) {
    prediction.feedback = boundary ? "区间选对了。请点出唯一候选项，再确认下标 3 在这一轮开始时是否还属于候选区间。" : "区间选对了。请在数组中点出实际比较的位置。如果知道 A[3] = 18，升序能保证 A[2] 至多是 18，还是至少是 18？";
  } else {
    prediction.passed = true;
    go(current+1);
    return;
  }
  event.target.querySelector(".feedback").textContent = prediction.feedback;
});
$("events").addEventListener("click",event=>{
  const button = event.target.closest("[data-event]");
  if(button) go(Number(button.dataset.event));
});
$("back").addEventListener("click",()=>go(current-1));
$("next").addEventListener("click",()=>go(current+1));
render();
</script></body></html>
